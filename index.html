<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <title>SCG • Infinite Zoom Experience</title>
  <meta name="description" content="Experiência imersiva de Infinite Zoom Scroll." />
  <meta name="theme-color" content="#040407" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;600&family=Outfit:wght@600;800&display=swap" rel="stylesheet" />

  <!-- Estilos da Aplicação -->
  <link rel="stylesheet" href="styles/tokens.css" />
  <link rel="stylesheet" href="styles/global.css" />
  <link rel="stylesheet" href="styles/scenes.css" />
</head>
<body class="bg-void-deep text-white antialiased select-none overflow-x-hidden">

  <!-- ============================================ -->
  <!--  PRELOADER CINEMATOGRÁFICO                   -->
  <!-- ============================================ -->
  <div id="preloader" class="fixed inset-0 z-[9999] flex flex-col items-center justify-center bg-[#040407]">
    <div class="preloader__ring"></div>
    <div class="preloader__progress-bar">
      <div id="preloader-progress-fill" class="preloader__progress-fill"></div>
    </div>
  </div>

  <!-- ============================================ -->
  <!--  BARRA DE PROGRESSO DO SCROLL                -->
  <!-- ============================================ -->
  <div id="scroll-progress" class="fixed top-0 left-0 h-[2px] bg-gradient-to-r from-[#D4247A] via-[#E8862A] to-[#FFB830] z-[101] transition-all duration-75" style="width: 0%;"></div>

  <!-- ============================================ -->
  <!--  MAIN SCENE CONTAINER                        -->
  <!-- ============================================ -->
  <main id="scene-container">

    <!-- ========================================== -->
    <!--  SCENE 00: INFINITE ZOOM SCROLL            -->
    <!-- ========================================== -->
    <section
      id="scene-00-void"
      class="scene"
      data-scene="00"
      data-scene-name="infinite-zoom"
      aria-label="Experiência Imersiva de Zoom Infinito"
    >
      <!-- CAMERA RIG (Controla o Zoom e enquadramento central) -->
      <div id="zoom-camera-rig" class="zoom-camera-rig">

        <!-- Canvas Principal de Frames (60fps Canvas Scrubbing) -->
        <canvas id="void-frame-canvas" class="zoom-canvas"></canvas>

        <!-- Canvas Holográfico de Íris, Esferas Orbitais e Partículas -->
        <canvas id="void-hud-canvas" class="zoom-canvas pointer-events-none"></canvas>

      </div>

      <!-- Flash de Transição Dimensional (Warp Climax) -->
      <div id="void-portal-flash"></div>

    </section>

  </main>

  <!-- ============================================ -->
  <!--  GSAP & SCROLLTRIGGER CDN                    -->
  <!-- ============================================ -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/ScrollTrigger.min.js"></script>

  <!-- ============================================ -->
  <!--  CORE ENGINE & SCENES                        -->
  <!-- ============================================ -->
  <script src="engine/scene-manager.js"></script>
  <script src="engine/performance-monitor.js"></script>
  <script src="engine/scroll-engine.js"></script>
  <script src="scenes/scene00-void.js"></script>
  <script src="app.js"></script>

</body>
</html>
